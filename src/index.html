<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Carril · tablero de tareas</title>
  <meta name="description" content="Tablero kanban personal hecho con Angular y el design system Trazo.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
  <script>
    // Aplica el tema guardado antes de pintar, para evitar un destello
    try {
      var t = localStorage.getItem('carril:tema');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-trz-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
